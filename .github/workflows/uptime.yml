name: Uptime ping

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health
        run: curl --fail --silent --show-error --max-time 90 https://tutorlink-api-549w.onrender.com/health
